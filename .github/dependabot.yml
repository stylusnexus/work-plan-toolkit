# Keeps dependencies and vulnerability fixes flowing into `dev` (the
# integration branch). Security updates ignore the schedule and grouping
# below and open immediately, but still honour target-branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /vscode
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      vscode-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
