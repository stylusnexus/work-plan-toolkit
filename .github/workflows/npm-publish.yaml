name: Publish CLI to npm

# Publishes the Python work-plan CLI as @stylusnexus/work-plan on npm, so it can
# be installed with `npm install -g @stylusnexus/work-plan` (e.g. for VS Code
# extension users who don't use the Claude/Codex plugin).
#
# Publishes with npm TRUSTED PUBLISHING (OIDC) — there is no NPM_TOKEN to rotate
# or expire. npm trusts this exact workflow once it is registered on npmjs.com:
# package @stylusnexus/work-plan → Settings → Trusted publisher → GitHub Actions,
# owner `stylusnexus`, repository `work-plan-toolkit`, workflow `npm-publish.yaml`
# (leave "Environment" blank). Token-based publishing is being restricted by npm
# for tokens that bypass 2FA, which is what broke the previous NPM_TOKEN.
#
# Run manually. dry_run=true (default) packs + validates without publishing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack + validate only — do not publish'
        type: boolean
        default: true
      version_suffix:
        description: 'Optional prerelease suffix (e.g. "-1") for same-day republish when CalVer is already taken'
        type: string
        default: ''

jobs:
  publish:
    name: pack · publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets npm exchange this run's OIDC identity for a publish credential
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # No `registry-url` on purpose: setting it makes setup-node export a dummy
          # NODE_AUTH_TOKEN, which npm then uses instead of the OIDC trusted-publisher
          # login and the publish fails with a 404.

      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          echo "node $(node --version) · npm $(npm --version)"

      - name: Derive npm version from VERSION (CalVer → semver)
        id: ver
        run: |
          RAW="$(cat VERSION)"            # e.g. 2026.06.09+8c10fe0
          BASE="${RAW%%+*}"              # 2026.06.09  (drop +sha build metadata)
          # npm/semver rejects leading zeros, so 2026.06.09 → 2026.6.9
          SEMVER="$(echo "$BASE" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')"
          SUFFIX="${{ inputs.version_suffix }}"
          FULL_VER="${SEMVER}${SUFFIX}"
          echo "semver=$FULL_VER" >> "$GITHUB_OUTPUT"
          echo "Publishing version $FULL_VER (from VERSION=$RAW, suffix='$SUFFIX')"

      - name: Stamp the version into package.json
        run: npm pkg set version="${{ steps.ver.outputs.semver }}"

      - name: Pack the tarball (always — proves the package is well-formed)
        run: npm pack

      - name: Publish to npm
        if: ${{ inputs.dry_run == false }}
        run: npm publish --access public --registry https://registry.npmjs.org/   # OIDC; provenance is attached automatically

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: work-plan-npm-tarball
          path: '*.tgz'
          if-no-files-found: error
