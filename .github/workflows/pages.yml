name: Deploy site to GitHub Pages

# Publishes the static site in site/ to https://stylusnexus.github.io/work-plan-toolkit/.
# Requires the repo's Pages source to be set to "GitHub Actions".
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and upload site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check site
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
